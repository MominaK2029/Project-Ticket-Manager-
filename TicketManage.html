<!DOCTYPE html>
<html>
<head>
<title>Ticket Manager</title>
</head>
<body>
<h1>Electrical Ticket Manager</h1>    
<div class="tab">
    <button class="tablinks" onclick="openTab(tasks, 'To-do')">To-do</button>
    <button class="tablinks" onclick="openTab(tasks, 'Pending')">Pending</button>
    <button class="tablinks" onclick="openTab(tasks, 'Completed')">Completed</button>
</div>

<div id="To-do" class="tabcontent">
    <h2>Incoming Tasks</h2>
    <table>
        <tr>
            <th>Timestamp</th>
            <th>Email Address</th>
            <th>Client</th>
            <th>Client's Extension/number</th>
            <th>Room Number</th>
            <th>Free Period</th>
            <th>Description</th>
            <th>Notes</th>
        </tr>
    </table>
</div>


</body>
</html>
